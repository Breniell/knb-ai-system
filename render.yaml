services:
  - type: web
    name: knb-ai-service
    runtime: python
    region: ohio
    plan: free
    rootDir: ai-services
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: GROQ_API_KEY
        value: ""
      - key: GEMINI_API_KEY
        value: ""
      - key: MISTRAL_API_KEY
        value: ""
      - key: OPENROUTER_API_KEY
        value: ""
      - key: FIREBASE_PROJECT_ID
        value: knb-ai-system
      - key: FIREBASE_CLIENT_EMAIL
        value: ""
      - key: FIREBASE_PRIVATE_KEY
        value: ""
      - key: FIREBASE_STORAGE_BUCKET
        value: knb-ai-system.firebasestorage.app
      - key: WEB_LEARNING_ENABLED
        value: "false"
      # fast = 2-3 appels LLM/agent (économise la quota gratuite Groq 100k TPD).
      # Passer à "balanced" ou "quality" si vous avez une clé payante ou OpenRouter.
      - key: KNB_PERF_PROFILE
        value: "fast"
      - key: NODE_ENV
        value: production

  - type: web
    name: knb-server
    runtime: node
    region: ohio
    plan: free
    rootDir: server
    buildCommand: npm install --include=dev && npx prisma generate && npm run build
    startCommand: (npx prisma db push --skip-generate || echo "db push failed — le serveur démarre quand même") && node dist/index.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: SERVER_PORT
        value: "10000"
      # DATABASE_URL: ajoutez un service PostgreSQL sur Render puis copiez
      # l'Internal Database URL ici. Ex: postgresql://user:pass@host/db
      - key: DATABASE_URL
        value: ""
      - key: FIREBASE_PROJECT_ID
        value: knb-ai-system
      # Laisser vide = mode sans-auth (client no-auth + serveur accepte les requêtes sans token).
      # Remplir avec les credentials du compte de service Firebase pour activer l'auth en production.
      - key: FIREBASE_CLIENT_EMAIL
        value: ""
      - key: FIREBASE_PRIVATE_KEY
        value: ""
      - key: FIREBASE_STORAGE_BUCKET
        value: knb-ai-system.firebasestorage.app
      - key: CORS_ORIGINS
        value: "https://knb-ai-system-client.vercel.app,http://localhost:5173,http://localhost:3001"
      - key: AI_SERVICE_PUBLIC_URL
        value: "https://knb-ai-service.onrender.com"
      - key: BOOTSTRAP_ADMIN_EMAILS
        value: knbdevsolutions@gmail.com
      # true = accepte les requêtes sans Bearer token (mode no-auth — compatible avec
      # le client Vercel quand VITE_FIREBASE_API_KEY est vide).
      # Mettre à false uniquement si FIREBASE_CLIENT_EMAIL et FIREBASE_PRIVATE_KEY sont remplis.
      - key: DEV_NO_AUTH
        value: "true"
      - key: JWT_SECRET
        generateValue: true
