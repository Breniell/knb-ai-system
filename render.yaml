services:
  - type: web
    name: knb-ai-service
    runtime: python
    region: ohio
    plan: free
    rootDir: ai-services
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: GROQ_API_KEY
        value: ""
      - key: GEMINI_API_KEY
        value: ""
      - key: MISTRAL_API_KEY
        value: ""
      - key: OPENROUTER_API_KEY
        value: ""
      - key: FIREBASE_PROJECT_ID
        value: knb-ai-system
      - key: FIREBASE_CLIENT_EMAIL
        value: ""
      - key: FIREBASE_PRIVATE_KEY
        value: ""
      - key: FIREBASE_STORAGE_BUCKET
        value: knb-ai-system.firebasestorage.app
      - key: WEB_LEARNING_ENABLED
        value: "true"
      - key: NODE_ENV
        value: production

  - type: web
    name: knb-server
    runtime: node
    region: ohio
    plan: free
    rootDir: server
    buildCommand: npm install --include=dev && npx prisma generate && npm run build
    startCommand: node dist/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: SERVER_PORT
        value: "10000"
      - key: FIREBASE_PROJECT_ID
        value: knb-ai-system
      - key: FIREBASE_CLIENT_EMAIL
        value: ""
      - key: FIREBASE_PRIVATE_KEY
        value: ""
      - key: FIREBASE_STORAGE_BUCKET
        value: knb-ai-system.firebasestorage.app
      - key: CORS_ORIGINS
        value: "https://knb-ai-system-client.vercel.app,http://localhost:5173,http://localhost:3001"
      - key: AI_SERVICE_PUBLIC_URL
        value: "https://knb-ai-service.onrender.com"
      - key: BOOTSTRAP_ADMIN_EMAILS
        value: knbdevsolutions@gmail.com
      - key: JWT_SECRET
        generateValue: true
